name: Automatic Challenge Awards - Public iScored Approval Feed
on:
  schedule:
    - cron: '52 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcade-verified-trophy-issuance
  cancel-in-progress: false
jobs:
  awards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test automatic award safeguards
        run: python tools/test_auto_challenge_awards.py
      - name: Test unified history safeguards
        run: python tools/test_unified_achievement_history.py
      - name: Test legacy credit parser and locked champion baselines
        run: python tools/test_generous_approval_credits.py
      - name: Test post-fix original submission participation rules (offline)
        run: python tools/test_submission_time_participation.py
      - name: Scan live iScored score feed (preview-only until approved API semantics verified)
        env:
          AUTO_CHALLENGE_AWARDS_ENABLED: ${{ vars.AUTO_CHALLENGE_AWARDS_ENABLED }}
        run: python tools/auto_verified_challenge_awards.py
      - name: Preserve baseline snapshots and public monthly reveal archive (legacy awards disabled)
        env:
          GENEROUS_CREDIT_ENABLED: 'false'
        run: python tools/generous_approval_credits.py
      - name: Record post-fix Daily and Thursday participation by original submission time
        run: python tools/submission_time_participation.py
      - name: Refresh unified history after automatic participation and champion updates
        run: python tools/build_unified_achievement_history.py
      - name: Save diagnostic summary and any enabled verified awards
        run: |
          git add challenge-auto-awards-preview.json unified-achievement-history.json approval-window-credit-report.json submission-time-participation-report.json
          if [ -f daily-champion-baselines.json ]; then git add daily-champion-baselines.json; fi
          if [ -f published-monthly-challenge-history.json ]; then git add published-monthly-challenge-history.json; fi
          if [ -f verified-challenge-awards.json ]; then git add verified-challenge-awards.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit or record automatically verified challenge awards"
          git pull --rebase origin main
          git push origin HEAD:main
