name: Give Props Digest — Delivery Outcome Tests (NO SEND)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/props_delivery_outcomes.py'
      - 'tests/test_props_delivery_outcomes.py'
      - '.github/workflows/props-delivery-outcome-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline delivery outcome tests
        run: python3 -m unittest discover -s tests -p 'test_props_delivery_outcomes.py'
      - name: Confirm no push or database credentials are required
        run: echo 'OFFLINE ONLY — no OneSignal call, no Supabase call, no ledger writes.'
