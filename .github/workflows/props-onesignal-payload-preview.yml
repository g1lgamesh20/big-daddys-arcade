name: Give Props Digest — OneSignal Payload Preview (NO SEND)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate notification payload offline
        run: python3 -m unittest discover -s tests -p 'test_props_onesignal_payload.py'
      - name: Preview live digest as OneSignal request (NO SEND)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/preview_props_onesignal_payload.py
