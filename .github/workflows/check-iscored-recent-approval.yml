name: iScored - Read Only Recent Approval Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public API for DAY Ghostbusters pinball score
        run: python tools/check_iscored_recent_approval.py
