name: Monthly Challenge - Save Game Pool
on:
  workflow_dispatch:
    inputs:
      excluded_ids:
        description: 'Paste comma-separated excluded game IDs from operator panel (empty means all eligible)'
        required: false
        type: string
      confirm_replace:
        description: 'Confirm replace ALL exclusions with this list'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: monthly-game-pool
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and save exclusions
        env:
          EXCLUDED_IDS: ${{ inputs.excluded_ids }}
          CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
        run: python3 tools/save_monthly_game_pool.py
      - name: Commit game pool
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monthly-game-pool.json
          git diff --cached --quiet && exit 0
          git commit -m 'Save monthly game pool exclusions'
          git push origin HEAD:main
