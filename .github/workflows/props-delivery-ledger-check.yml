name: Give Props Digest — Delivery Ledger Check (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test delivery state decisions (offline)
        run: python3 -m unittest discover -s tests -p 'test_props_delivery_ledger.py'
      - name: Verify private delivery ledger (READ ONLY)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/verify_props_delivery_ledger.py
