name: Stage 4 Secret Achievement Safety Tests
on:
  pull_request:
    paths:
      - 'tools/secret_*.py'
      - 'tools/test_secret_*.py'
      - 'secret-score-evidence.json'
      - 'secret-achievement-preview.json'
      - '.github/workflows/stage4-secret-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Stage 4 evaluator and evidence journal (no network or writes)
        run: python -m unittest discover -s tools -p 'test_secret*.py' -v
      - name: Validate Python syntax
        run: python -m compileall -q tools/secret_achievements.py tools/secret_evidence_journal.py tools/secret_preview.py
