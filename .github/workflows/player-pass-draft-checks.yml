name: Player Pass draft security checks

on:
  push:
    branches:
      - feature/player-pass-foundation-20261127
    paths:
      - 'tests/test_player_pass_*.py'
      - 'scripts/prepare-don-bootstrap.py'
      - 'supabase/migrations/*player_pass*'
      - '.github/workflows/player-pass-draft-checks.yml'
      - 'tests/player_pass_postgres_smoke.sql'
  pull_request:
    paths:
      - 'tests/test_player_pass_*.py'
      - 'scripts/prepare-don-bootstrap.py'
      - 'supabase/migrations/*player_pass*'
      - '.github/workflows/player-pass-draft-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Player Pass offline regression tests
        run: python -m unittest discover -s tests -p 'test_player_pass_*.py' -v

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: arcade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: arcade_test
    steps:
      - uses: actions/checkout@v4
      - name: Test draft SQL in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/player_pass_postgres_smoke.sql
