name: Refresh Hall of Legends Scores
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Share the verified-award issuance lock with auto-challenge-awards.yml and
  # verify-challenge-award.yml. All three write the same permanent trophy ledger.
  group: arcade-verified-trophy-issuance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Hall of Achievements JavaScript
        run: |
          node --check achievement-showcase.js
          node --check easter-egg.js
      - name: Test game marquee preloader without network requests
        run: node tools/test_game_marquee.js
      - name: Test future marquee updates and game-inventory merge safeguards
        run: node tools/test_marquee_update.js
      - name: Test bulk iScored logo metadata import safeguards
        run: python tools/test_import_game_logos.py
      - name: Test medal detection
        run: python tools/test_medals.py
      - name: Verify Golden Encore score-improvement safeguards
        run: python tools/test_golden_encore.py
      - name: Verify observed Gold holder history safeguards (offline)
        run: python tools/test_gold_holder_history.py
      - name: Verify Gold-history secret evidence preview (offline)
        run: python tools/test_gold_history_secret_preview.py
      - name: Verify Daily selection history safeguards
        run: python tools/test_daily_history.py
      - name: Test bounded iScored read retries (offline)
        run: python tools/test_iscored_fetch_retry.py
      - name: Test refresh heartbeat and gap calculations (offline)
        run: python tools/test_refresh_health.py
      - name: Test secret award evaluator and immutable evidence journal (offline)
        run: python -m unittest discover -s tools -p 'test_secret*.py'
      - name: Verify BACK FROM THE DEAD comeback evidence (offline)
        run: python tools/test_back_from_the_dead_preview.py
      - name: Verify NEVER GIVE UP evidence safeguards (offline)
        run: python tools/test_never_give_up_preview.py
      - name: Verify JUST IN TIME last-minute Daily victory safeguards (offline)
        run: python tools/test_just_in_time.py
      - name: Verify TREASURE HUNTER prospective first Gold safeguards (offline)
        run: python tools/test_treasure_hunter.py
      - name: Verify PHOTO FINISH evidence and lifetime safeguards (offline)
        run: python tools/test_photo_finish.py
      - name: Verify DOUBLE TROUBLE evidence and lifetime safeguards (offline)
        run: python tools/test_double_trouble.py
      - name: Verify KING FOR A DAY award activation safeguards (offline)
        run: python tools/test_king_for_a_day_activate.py
      - name: Verify BACK FROM THE DEAD award activation safeguards (offline)
        run: python tools/test_back_from_the_dead_activate.py
      - name: Verify NEVER GIVE UP award activation safeguards (offline)
        run: python tools/test_never_give_up_activate.py
      - name: Verify Personal Best evidence safeguards (offline)
        run: python tools/test_personal_best_preview.py
      - name: Verify controlled Personal Best milestone activation (offline)
        run: python tools/test_personal_best_activate.py
      - name: Verify monthly finalization, podium and dual-trophy rules (offline)
        run: python -m unittest discover -s tools -p 'test_monthly_finalization.py'
      - name: Verify Easter Egg sync and duplicate safeguards (offline)
        run: python tools/test_easter_egg_sync.py
      - name: Validate prospective social trophy synchronization (offline)
        run: python tools/test_social_trophy_sync.py
      - name: Test Thanksgiving-only lifetime achievement and Eastern midnight boundaries (offline)
        run: python tools/test_thanksgiving_awards.py
      - name: Test Christmas, New Year's, MAR10 and May Fourth holiday awards
        run: python tools/test_seasonal_holiday_awards.py
      - name: Test Wave 2 Holiday Legends and Holy Thursday Olympics (offline)
        run: python tools/test_holiday_legends_wave2.py
      - name: Download scores and update medal feed
        id: score_download
        run: python tools/update_legends.py
      - name: Preview Gold history secret evidence (NO awards or pushes)
        run: python tools/gold_history_secret_preview.py
      - name: Capture permanent approved-score evidence (PREVIEW ONLY)
        id: secret_journal
        run: python tools/secret_evidence_journal.py
      - name: Preview BACK FROM THE DEAD verified comebacks (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/back_from_the_dead_preview.py
      - name: Activate verified BACK FROM THE DEAD lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          BACK_FROM_THE_DEAD_AWARDS_ENABLED: '1'
        run: python tools/back_from_the_dead_activate.py
      - name: Activate verified KING FOR A DAY lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          KING_FOR_A_DAY_AWARDS_ENABLED: '1'
        run: python tools/king_for_a_day_activate.py
      - name: Preview JUST IN TIME final-five-minute victories (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/just_in_time_preview.py
      - name: Activate verified JUST IN TIME lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          JUST_IN_TIME_AWARDS_ENABLED: '1'
        run: python tools/just_in_time_activate.py
      - name: Preview TREASURE HUNTER first Gold evidence (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/treasure_hunter_preview.py
      - name: Activate verified TREASURE HUNTER lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          TREASURE_HUNTER_AWARDS_ENABLED: '1'
        run: python tools/treasure_hunter_activate.py
      - name: Preview PHOTO FINISH near-miss evidence (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/photo_finish_preview.py
      - name: Activate verified PHOTO FINISH lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          PHOTO_FINISH_AWARDS_ENABLED: '1'
        run: python tools/photo_finish_activate.py
      - name: Preview DOUBLE TROUBLE verified Gold takeovers (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/double_trouble_preview.py
      - name: Activate verified DOUBLE TROUBLE lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          DOUBLE_TROUBLE_AWARDS_ENABLED: '1'
        run: python tools/double_trouble_activate.py
      - name: Preview NEVER GIVE UP Gold evidence (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/never_give_up_preview.py
      - name: Activate verified NEVER GIVE UP lifetime awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          NEVER_GIVE_UP_AWARDS_ENABLED: '1'
        run: python tools/never_give_up_activate.py
      - name: Preview approved Personal Best improvements (NO awards or pushes)
        if: ${{ steps.secret_journal.outcome == 'success' }}
        run: python tools/personal_best_preview.py
      - name: Activate verified Personal Best milestones (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          PERSONAL_BEST_AWARDS_ENABLED: '1'
        run: python tools/personal_best_activate.py
      - name: Activate Stage 4 verified secret awards (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          STAGE4_AWARDS_ENABLED: '1'
        run: python tools/secret_activate.py
      - name: Award Thanksgiving-approved submissions from original submit time (no notifications)
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          THANKSGIVING_AWARDS_ENABLED: '1'
        run: python tools/thanksgiving_awards.py
      - name: Award Christmas New Year's MAR10 and May Fourth lifetime trophies
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          SEASONAL_HOLIDAY_AWARDS_ENABLED: '1'
        run: python tools/seasonal_holiday_awards.py
      - name: Award Wave 2 holidays, lifetime holiday milestones, and Holy Thursday participation
        if: ${{ github.ref == 'refs/heads/main' && steps.secret_journal.outcome == 'success' }}
        env:
          HOLIDAY_WAVE2_AWARDS_ENABLED: '1'
        run: python tools/holiday_legends_wave2.py
      - name: Send new medal notifications
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python tools/send_medal_notifications.py
      - name: Sync saved Easter Egg claims into the permanent trophy ledger
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: python tools/easter_egg_sync.py
      - name: Synchronize prospective social milestones (no notifications)
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: python tools/social_trophy_sync.py
      - name: Record successful refresh and scheduler freshness gap
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python tools/refresh_health.py
      - name: Commit updated scoreboard and notification state
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.score_download.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-champion-history.json monthly-game-catalog.json legends.json medals.json medal-state.json arcade-records.json daily-champion.json medal-notification-state.json golden-encore-state.json gold-holder-history.json treasure-hunter-state.json verified-challenge-awards.json
          if [ -f daily-champion-baselines.json ]; then git add daily-champion-baselines.json; fi
          if [ -f refresh-health.json ]; then git add refresh-health.json; fi
          # Only commit the journal when its complete validation and preview succeeded.
          if [ "${{ steps.secret_journal.outcome }}" = 'success' ]; then
            git add secret-score-evidence.json secret-achievement-preview.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh arcade legends and notification state'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Conflicting scoreboard update; refusing to overwrite another workflow.'
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push rejected (attempt $attempt/3); retrying."
              sleep $((attempt * 2))
            done
            echo 'Scoreboard push failed after three attempts.'
            exit 1
          fi
