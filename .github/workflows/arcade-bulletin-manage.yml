name: Manage Arcade Bulletins
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose edit or delete'
        required: true
        type: choice
        options:
          - edit
          - delete
      bulletin_id:
        description: 'Exact bulletin ID from arcade-news.json'
        required: true
        type: string
      title:
        description: 'Replacement title (edit only; 1–80 characters)'
        required: false
        type: string
      message:
        description: 'Replacement message (edit only; 1–240 characters)'
        required: false
        type: string
      confirm_delete:
        description: 'Check this box to confirm deletion (delete only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: arcade-news-publish
  cancel-in-progress: false
jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Update bulletin archive
        env:
          BULLETIN_ACTION: ${{ inputs.action }}
          BULLETIN_ID: ${{ inputs.bulletin_id }}
          BULLETIN_TITLE: ${{ inputs.title }}
          BULLETIN_MESSAGE: ${{ inputs.message }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: python3 tools/manage_arcade_bulletin.py
      - name: Commit archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade-news.json
          git diff --cached --quiet && { echo 'No change to save'; exit 0; }
          git commit -m 'Manage Arcade News bulletin'
          git push origin HEAD:main
