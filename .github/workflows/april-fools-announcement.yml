name: April Fools Arcade News - Tease and Reveal
on:
  schedule:
    # Retry twice during the 9 AM Eastern hour; Python gate enforces ET and dates.
    - cron: '5,35 13,14 1,2 4 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcade-news-publish
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test harmless April Fools scheduling and duplicate safeguards
        run: python tools/test_april_fools_bulletin.py
      - name: Publish idempotent April Fools Arcade News item at 9 AM ET
        run: python tools/april_fools_bulletin.py publish
      - name: Archive April Fools bulletin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade-news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish scheduled April Fools Arcade News'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort; exit 1; fi
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Send idempotent April Fools announcement through existing OneSignal
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python tools/april_fools_bulletin.py send
      - name: Remember successful April Fools notification
        run: |
          git add april-fools-notification-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Remember April Fools OneSignal announcement delivery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
