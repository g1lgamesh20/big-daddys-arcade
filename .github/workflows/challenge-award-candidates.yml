name: Capture Daily and Thursday Trophy Candidates
on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcade-trophy-candidate-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture provisional score evidence
        run: python tools/challenge_award_candidates.py
      - name: Store candidate history without issuing awards
        run: |
          git add challenge-award-candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record pending Daily and Thursday achievement evidence"
          git pull --rebase origin main
          git push origin HEAD:main
