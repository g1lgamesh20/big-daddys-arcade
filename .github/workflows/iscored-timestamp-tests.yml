name: Test iScored Central-Time Foundation
on:
  pull_request:
    paths:
      - 'tools/iscored_timestamp.py'
      - 'tools/thursday_challenge.py'
      - 'tools/monthly_benchmark.py'
      - 'tools/test_iscored_timestamp.py'
      - '.github/workflows/iscored-timestamp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only existing monthly encryption dependency
        run: python -m pip install cryptography
      - name: Check syntax and Central/Eastern time boundaries
        run: |
          python -m py_compile tools/iscored_timestamp.py tools/thursday_challenge.py tools/monthly_benchmark.py
          python tools/test_iscored_timestamp.py
      - name: Verify existing monthly privacy safeguards
        run: python tools/test_monthly_readiness.py
