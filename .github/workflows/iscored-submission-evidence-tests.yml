name: Test iScored Submission Evidence Audit
on:
  pull_request:
    paths:
      - 'tools/iscored_submission_evidence_audit.py'
      - 'tools/test_iscored_submission_evidence_audit.py'
      - '.github/workflows/iscored-submission-evidence.yml'
      - '.github/workflows/iscored-submission-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run no-network source integrity tests
        run: python tools/test_iscored_submission_evidence_audit.py
