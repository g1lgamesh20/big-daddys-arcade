name: Give Props — Reconciliation Edge Tests (NO SEND)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/test_props_reconciliation_edges.py'
      - '.github/workflows/props-reconciliation-edge-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic reaction lifecycle tests
        run: python3 -m unittest discover -s tests -p 'test_props_reconciliation_edges.py'
