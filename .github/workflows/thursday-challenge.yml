name: Thursday Challenge Announcement
on:
  schedule:
    # Both UTC hours cover 9 AM New York across daylight-saving changes.
    - cron: '0 13,14 * * 4,5'
    # Refresh standings and finalize Thursday winners through the week.
    - cron: '37 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thursday-challenge-announcement
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build or refresh featured game
        run: python tools/thursday_challenge.py
      - name: Send once at 9 AM Eastern
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python tools/send_thursday_notification.py
      - name: Send Friday champion notification at 9 AM Eastern
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python tools/send_friday_champion_notification.py
      - name: Save challenge and announcement state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thursday-challenge.json thursday-challenge-state.json thursday-winners.json
          if [ -f thursday-notification-state.json ]; then
            git add thursday-notification-state.json
          fi
          if [ -f friday-champion-notification-state.json ]; then
            git add friday-champion-notification-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Thursday challenge announcement and winner history"
            git pull --rebase origin main
            git push
          fi
