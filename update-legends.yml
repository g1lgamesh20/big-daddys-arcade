name: Refresh Hall of Legends scores
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public scores and update leaderboard
        run: python tools/update_legends.py
      - name: Commit new leaderboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legends.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public arcade legends"
            git push
          fi
