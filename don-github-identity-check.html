<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DON GitHub Identity Check — Big Daddy's Arcade</title>
<style>body{background:#090714;color:#eafbe8;font:16px system-ui;margin:0;padding:3rem 1rem}main{max-width:640px;margin:auto;border:1px solid #72ff9e;border-radius:16px;padding:24px}h1{color:#ff69ce}button{background:#7fff9d;color:#121212;border:0;border-radius:8px;padding:14px 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}code{overflow-wrap:anywhere}</style></head>
<body><main><h1>🤖 DON — GitHub Identity Check</h1>
<p>This page verifies your GitHub sign-in with Supabase. It does <strong>not</strong> activate a Player Pass or grant administrator access.</p>
<button id="login">SIGN IN WITH GITHUB</button>
<button id="check">CHECK MY SIGN-IN</button>
<p id="status" role="status" aria-live="polite">Not checked yet.</p>
<p>After GitHub returns you to this page, click <strong>CHECK MY SIGN-IN</strong>.</p>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.57.4";
const supabase=createClient("https://jrqzwlowxofnyqpmjgkg.supabase.co","sb_publishable_AYOK3FB6Kw0Oun_Sugq1wQ_brAZ3VRi",{auth:{flowType:"pkce",persistSession:true,detectSessionInUrl:true}});
const status=document.querySelector("#status");
document.querySelector("#login").addEventListener("click",async()=>{
  status.textContent="Opening GitHub…";
  const {error}=await supabase.auth.signInWithOAuth({provider:"github",options:{redirectTo:"https://g1lgamesh20.github.io/big-daddys-arcade/don-github-identity-check.html",scopes:"read:user"}});
  if(error)status.textContent="Sign-in could not start: "+error.message;
});
document.querySelector("#check").addEventListener("click",async()=>{
  status.textContent="Checking identity…";
  const {data,error}=await supabase.auth.getUser();
  if(error||!data?.user){status.textContent="No authenticated GitHub session found. Sign in first.";return;}
  const u=data.user;
  if(u.is_anonymous||!u.app_metadata?.providers?.includes("github")){
    status.textContent="A session exists, but it is not a verified GitHub sign-in.";return;
  }
  status.textContent="GitHub identity verified in Supabase. The operator can now verify your Auth user record server-side. Administrator access is NOT yet granted.";
});
</script></body></html>
